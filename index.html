<!DOCTYPE html>
<html lang="en">

<head>
    <title>Getting Started with VR</title>
    <meta name="description" content="Getting Started with VR">
    <meta charset="utf-8">
    <script src="https://aframe.io/releases/0.9.1/aframe.min.js"></script>
</head>

<body>
    <a-scene>
        <a-sky src="https://media.istockphoto.com/id/1218214908/photo/aerial-photo-360-degrees-in-vaujany-french-alps.jpg?s=612x612&w=0&k=20&c=tQWD8U1nsUAMwanYWXNCTXLviGSHsI_wJAQ-qPDLzg4="></a-sky>
        <a-cylinder id="cylinder1" src="https://t3.ftcdn.net/jpg/04/40/22/70/360_F_440227009_RvjpN1G6Ei2X3SAS6N32sHQOmV68VTLn.jpg" position="0 0.5 -5" rotation="0 0 0" scale="1 1 1" animation__position="property: object3D.position.y; to: 2.2; dir: alternate; dur: 2000; loop: true"

        animation__mouseleave="property: scale; to: 2 2 2; dur: 300; startEvents: mouseleave" height="0.5" radius="2" metalness="1"></a-cylinder>

        <!-- <a-light type="ambient" color="#FDFD96"></a-light> -->

        <a-camera>
            <a-cursor color="red"></a-cursor>
        </a-camera>
      </a-scene>
    
</body>

</html>
